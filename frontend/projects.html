<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — VisionTwin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container-fluid px-4 py-4 max-w-7xl">
    <!-- Header -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div>
        <h2 class="fw-bolder mb-1">
          <i class="bi bi-folder2-open text-emerald me-2"></i>Projects & Room Workspaces
        </h2>
        <p class="text-muted small mb-0">
          Manage digital twin spaces, room dimensions, custom electricity tariffs, and appliance inventories.
        </p>
      </div>
      <button class="btn btn-vt-primary" data-bs-toggle="modal" data-bs-target="#createProjectModal">
        <i class="bi bi-plus-lg me-1"></i> Create New Project
      </button>
    </div>

    <!-- Projects Grid Container -->
    <div class="row g-4 mb-5" id="projects-grid">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-emerald mb-2" role="status"></div>
        <div>Loading your projects...</div>
      </div>
    </div>
  </main>

  <!-- Create Project Modal -->
  <div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="createProjectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-card border-secondary">
        <div class="modal-header border-secondary border-opacity-25">
          <h5 class="modal-title" id="createProjectModalLabel">
            <i class="bi bi-folder-plus text-emerald me-2"></i>Create Room Project
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-create-project">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Project Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="new-proj-name" placeholder="e.g. Master Bedroom or Living Room" required />
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Room Type</label>
                <select class="form-select" id="new-proj-room-type">
                  <option value="living_room">Living Room</option>
                  <option value="bedroom">Bedroom</option>
                  <option value="kitchen">Kitchen</option>
                  <option value="office">Office / Workspace</option>
                  <option value="commercial">Commercial / Retail</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Electricity Tariff (₹/kWh)</label>
                <input type="number" class="form-control font-monospace" id="new-proj-tariff" value="8.0" step="0.5" min="0.5" max="100" />
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-4">
                <label class="form-label small text-muted">Length (m)</label>
                <input type="number" class="form-control form-control-sm font-monospace" id="new-proj-len" value="5.0" step="0.1" />
              </div>
              <div class="col-4">
                <label class="form-label small text-muted">Width (m)</label>
                <input type="number" class="form-control form-control-sm font-monospace" id="new-proj-width" value="4.0" step="0.1" />
              </div>
              <div class="col-4">
                <label class="form-label small text-muted">Height (m)</label>
                <input type="number" class="form-control form-control-sm font-monospace" id="new-proj-height" value="2.8" step="0.1" />
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label">Description (Optional)</label>
              <textarea class="form-control" id="new-proj-desc" rows="2" placeholder="Brief project goals or notes..."></textarea>
            </div>
          </div>
          <div class="modal-footer border-secondary border-opacity-25">
            <button type="button" class="btn btn-vt-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-vt-primary" id="btn-submit-project">Create Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/projects.page.js"></script>
</body>
</html>
