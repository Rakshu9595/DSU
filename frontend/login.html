<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — VisionTwin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">
  <div id="navbar-container"></div>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="vt-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="vt-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="bi bi-lightning-charge-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to your VisionTwin energy optimization studio</p>
          </div>

          <div id="login-alert" class="alert alert-danger d-none small py-2" role="alert"></div>

          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" required autocomplete="email" placeholder="name@example.com" />
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control" id="password" required autocomplete="current-password" placeholder="••••••••" />
              </div>
            </div>

            <button type="submit" class="btn btn-vt-primary w-100 py-2 mb-3" id="login-submit-btn">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>

            <!-- One-Click Demo Login Helper -->
            <button type="button" class="btn btn-vt-secondary w-100 py-2 small" id="demo-autofill-btn">
              <i class="bi bi-lightning-charge text-emerald me-1"></i> Quick Demo Login (demo@visiontwin.io)
            </button>
          </form>

          <div class="text-center mt-4 text-muted small">
            Don't have an account? <a href="/register.html" class="text-emerald fw-semibold">Sign up free</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 border-top border-secondary text-center text-muted small">
    <div class="container">VisionTwin Studio &copy; 2026</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/login.page.js"></script>
</body>
</html>
