<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — VisionTwin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">
  <div id="navbar-container"></div>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="vt-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="vt-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Create Account</h3>
            <p class="text-muted small">Start analyzing rooms & creating digital twins</p>
          </div>

          <div id="register-alert" class="alert alert-danger d-none small py-2" role="alert"></div>

          <form id="register-form">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" required placeholder="Dr. John Doe" />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" required placeholder="name@example.com" />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required minlength="6" placeholder="Min. 6 characters" />
            </div>

            <button type="submit" class="btn btn-vt-primary w-100 py-2 mb-3" id="register-submit-btn">
              <i class="bi bi-person-check-fill me-1"></i> Register Free
            </button>
          </form>

          <div class="text-center mt-3 text-muted small">
            Already have an account? <a href="/login.html" class="text-emerald fw-semibold">Sign in here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 border-top border-secondary text-center text-muted small">
    <div class="container">VisionTwin Studio &copy; 2026</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/register.page.js"></script>
</body>
</html>
